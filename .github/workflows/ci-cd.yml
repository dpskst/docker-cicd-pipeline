name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-cicd-main
  cancel-in-progress: true

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t dydcjsrjaror/my-devops-app:${{ github.sha }} \
            -t dydcjsrjaror/my-devops-app:latest \
            ./app

      - name: Test Docker image
        run: |
          docker run -d \
            --name test-container \
            -p 8080:80 \
            dydcjsrjaror/my-devops-app:${{ github.sha }}

          sleep 5

          curl http://localhost:8080

          docker stop test-container
          docker rm test-container

      - name: Push Docker image
        run: |
          docker push dydcjsrjaror/my-devops-app:${{ github.sha }}
          docker push dydcjsrjaror/my-devops-app:latest

      - name: Deploy to devops-lab
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 51004
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull dydcjsrjaror/my-devops-app:${{ github.sha }}

            docker stop my-devops-app || true
            docker rm my-devops-app || true

            docker run -d \
              --name my-devops-app \
              -p 8080:80 \
              dydcjsrjaror/my-devops-app:${{ github.sha }}

            docker ps
